# Vale — mechanical prose rules, run by the pre-commit hook on staged *.md.
# Judgment (dying metaphors, pretentious diction) belongs to the
# plain-english / simple-english skills, not here.
StylesPath = .vale/styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = Orwell
BlockIgnores = (?s) *(```.*?```)
TokenIgnores = (`[^`]+`)
