{# Loaded into the page's dialog. Errors re-render just this form; success closes the dialog. #}
<form class="form" hx-post="/address/{{ ip }}/static" hx-target="this" hx-swap="outerHTML">
	<div class="dialog-head">
		<h2>{{ "Edit" if existing else "New" }} static entry</h2>
		<button type="button" class="icon-button" aria-label="Close" @click="$dispatch('close-dialog')">×</button>
	</div>
	<p class="mono">{{ ip }}</p>
	{% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
	<label class="field"><span>Label</span>
		<input name="hostname" value="{{ values.hostname }}" autocomplete="off"></label>
	<label class="field"><span>MAC address</span>
		<input name="mac_address" value="{{ values.mac_address }}" placeholder="aa:bb:cc:dd:ee:ff" autocomplete="off" spellcheck="false"></label>
	<label class="field"><span>Description</span>
		<input name="description" value="{{ values.description }}" autocomplete="off"></label>
	<label class="field"><span>Notes</span>
		<textarea name="notes" rows="3">{{ values.notes }}</textarea></label>
	<div class="form-actions">
		<button type="submit" class="button button-primary">Save</button>
		{% if existing %}
		<button type="button" class="button button-danger-soft" hx-delete="/address/{{ ip }}/static"
			hx-confirm="Delete the static entry for {{ ip }}?" hx-target="closest form" hx-swap="outerHTML">Delete</button>
		{% endif %}
		<button type="button" class="button button-quiet" @click="$dispatch('close-dialog')">Cancel</button>
	</div>
</form>
