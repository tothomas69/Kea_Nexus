name: keanexus

services:
    keanexus:
        build: .
        container_name: keanexus
        restart: unless-stopped
        ports:
            - "8502:8501"
        env_file:
            - .env
        volumes:
            - ./app.py:/app/app.py
            - ./auth.py:/app/auth.py
            - ./kea.py:/app/kea.py
            - ./quarantine_client.py:/app/quarantine_client.py
            - ./version.py:/app/version.py
            - ./helpers.py:/app/helpers.py
            - ./dashboard_data.py:/app/dashboard_data.py
            - ./pool_history.py:/app/pool_history.py
            - ./address_map.py:/app/address_map.py
            - ./db.py:/app/db.py
            - ./ui_login.py:/app/ui_login.py
            - ./ui_dashboard.py:/app/ui_dashboard.py
            - ./ui_docs.py:/app/ui_docs.py
            - ./docs_library.py:/app/docs_library.py
            - ./ui_leases.py:/app/ui_leases.py
            - ./ui_ipam.py:/app/ui_ipam.py
            - ./ui_reservations.py:/app/ui_reservations.py
            - ./ui_maintenance.py:/app/ui_maintenance.py
            - ./ui_quarantine.py:/app/ui_quarantine.py
            - ./ui_settings.py:/app/ui_settings.py
            - ./ui_users.py:/app/ui_users.py
            - ./ui_access.py:/app/ui_access.py
            - ./streamlit_adapter.py:/app/streamlit_adapter.py
            - ./style.css:/app/style.css
            - ./.streamlit:/app/.streamlit
            - ./static:/app/static
            - ./docs:/app/docs
            - ./data:/app/data
        command: >
            streamlit run app.py
            --server.runOnSave=true
            --server.fileWatcherType=poll
            --server.port=8501
            --server.address=0.0.0.0
            --server.headless=true
            --browser.gatherUsageStats=false

    # The FastAPI + HTMX UI, run beside the Streamlit UI until cutover.
    # See docs/fastapi-htmx-migration.md. Same image, different command.
    keanexus-web:
        build: .
        container_name: keanexus-web
        restart: unless-stopped
        ports:
            - "8503:8000"
        env_file:
            - .env
        environment:
            # The Streamlit container still runs the pool sampler. Two samplers
            # would write every reading twice, so this stays "off" until cutover.
            KEANEXUS_WEB_BACKGROUND_WORK: "off"
        volumes:
            - ./auth.py:/app/auth.py
            - ./db.py:/app/db.py
            - ./kea.py:/app/kea.py
            - ./helpers.py:/app/helpers.py
            - ./address_map.py:/app/address_map.py
            - ./dashboard_data.py:/app/dashboard_data.py
            - ./docs_library.py:/app/docs_library.py
            - ./pool_history.py:/app/pool_history.py
            - ./quarantine_client.py:/app/quarantine_client.py
            - ./version.py:/app/version.py
            - ./web:/app/web
            - ./static:/app/static
            - ./docs:/app/docs
            - ./data:/app/data
        # --proxy-headers makes Nginx Proxy Manager's X-Forwarded-Proto set the
        # request scheme, so session cookies get the Secure flag over HTTPS.
        command: >
            uvicorn web.main:app
            --host 0.0.0.0
            --port 8000
            --proxy-headers
            --forwarded-allow-ips=*
        # The image's own HEALTHCHECK probes Streamlit's port; this container
        # serves uvicorn on 8000 instead.
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
            interval: 30s
            timeout: 5s
            start_period: 10s
            retries: 3

    keanexus-quarantine:
        build:
            context: .
            dockerfile: quarantine_service/Dockerfile
        container_name: keanexus-quarantine
        restart: unless-stopped
        # Host networking, not a bridge — ARP disruption and Kea's own DHCP
        # broadcast handling both need real L2 access. NET_RAW/NET_ADMIN are
        # scoped to this container only; KeaNexus and Kea itself stay unprivileged.
        # See docs/quarantine-feature-design.md, open decisions #1 and #4.
        network_mode: host
        cap_add:
            - NET_RAW
            - NET_ADMIN
        env_file:
            - quarantine_service/.env
        volumes:
            - ./data:/app/data
        # Opt-in only — never builds or starts unless explicitly requested:
        #   docker compose --profile quarantine up
        profiles:
            - quarantine
