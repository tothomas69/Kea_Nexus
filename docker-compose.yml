name: keanexus

services:
    # The KeaNexus web UI (FastAPI + HTMX).
    keanexus:
        build: .
        container_name: keanexus
        restart: unless-stopped
        # Host networking, not a bridge: "Check who's online" ARP-sweeps the
        # LAN, and ARP only reaches devices on the same layer-2 segment. With
        # host networking `ports:` is ignored, so uvicorn binds 8502 itself
        # (PORT below): the port the Streamlit UI used, so Nginx Proxy
        # Manager's upstream (172.16.17.215:8502) doesn't change.
        network_mode: host
        # NET_RAW only: enough to open the raw socket an ARP sweep needs.
        # The container runs as root, so no file capabilities are needed.
        cap_add:
            - NET_RAW
        environment:
            - PORT=8502
        env_file:
            - .env
        volumes:
            - ./auth.py:/app/auth.py
            - ./db.py:/app/db.py
            - ./kea.py:/app/kea.py
            - ./helpers.py:/app/helpers.py
            - ./address_map.py:/app/address_map.py
            - ./dashboard_data.py:/app/dashboard_data.py
            - ./dashboard_charts.py:/app/dashboard_charts.py
            - ./docs_library.py:/app/docs_library.py
            - ./pool_history.py:/app/pool_history.py
            - ./version.py:/app/version.py
            - ./web:/app/web
            - ./static:/app/static
            - ./docs:/app/docs
            - ./data:/app/data
